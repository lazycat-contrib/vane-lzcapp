application:
  subdomain: vane
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://vane:3000/

services:
  vane:
    # upstream: itzcrazykns1337/vane:v1.12.2 (docker.io)
    image: docker.1ms.run/itzcrazykns1337/vane:v1.12.2
    binds:
      - /lzcapp/var/vane:/home/vane/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
