version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/vane.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: vane

build:
  run_buildscript: false

images:
  - id: vane
    target: service
    service: vane
    source: docker.io/itzcrazykns1337/vane
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Vane
    summary: "隐私优先的 AI 问答引擎（内置 SearXNG）"
